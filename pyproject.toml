[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-dpi-tool"
version = "0.1.0rc1"
description = "Standalone brand-neutral Mouse DPI Tool (Effective CPI measurement)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mouse DPI Tool Authors" }]
dependencies = [
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# PySide6 is a UI optional dependency. Portable bundles via packaging (separate compliance gate).
ui = [
  "PySide6>=6.6",
]

[project.scripts]
mouse-dpi-tool = "mouse_dpi_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mouse_dpi_tool = ["resources/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "windows_hw: optional real-mouse Raw Input smoke (set MOUSEDPI_HW_SMOKE=1)",
]
